site_name: ADL Third-Party Loaders
site_url: https://radarml.github.io/adl-3p-loaders
repo_url: https://github.com/RadarML/adl-3p-loaders
repo_name: RadarML/adl-3p-loaders
nav:
  - Home:
    - Overview: index.md
    - Development: develop.md
  - Datasets:
    - coloradar: coloradar/index.md
    - coloradar.types: coloradar/types.md
    - grade: grade/index.md
    - grade.types: grade/types.md

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  icon:
    logo: material/file-swap
    annotation: material/arrow-right-circle
  font:
    code: monospace
  features:
    - navigation.instant
    - navigation.expand
    - navigation.tabs
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: purple
    accent: deep purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: purple
    accent: deep purple
    toggle:
      icon: material/weather-night
      name: Switch to system preference

plugins:
- search
- autorefs
- llmstxt:
    full_output: llms-full.txt
    markdown_description: |
      `adl-3p-loaders` is a python library of data loaders for third-party
      datasets which implement the abstract dataloader specification. Each
      dataset is exposed as a collection of sensors, traces, and datasets
      which return typed, batched numpy dataclasses.
    sections:
      "Home":
      - index.md: Project overview, supported datasets, and installation
      - develop.md: Development environment setup, testing, and documentation
      "Datasets":
      - coloradar/index.md: ColoRadar single-chip radar ADC and lidar loader
      - coloradar/types.md: ColoRadar data types
      - grade/index.md: GRADE single-chip radar ADC, ZED depth, and smoke sensor loader
      - grade/types.md: GRADE data types
- mkdocstrings:
    default_handler: python_xref
    handlers:
      python_xref:
        paths: [src]
        options:
          docstring_style: google
          relative_crossrefs: true
          separate_signature: true
          line_length: 80
          show_signature_annotations: true
          signature_crossrefs: true
          show_root_full_path: true
          show_root_members_full_path: true
          show_symbol_type_heading: true
          show_root_heading: true
          show_root_toc_entry: true
          heading_level: 1
          check_crossrefs_exclude:
          - "^numpy\\.(.*)"
        inventories:
        - https://docs.python.org/3/objects.inv
        - https://numpy.org/doc/stable/objects.inv
        - https://radarml.github.io/abstract-dataloader/objects.inv

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - footnotes
